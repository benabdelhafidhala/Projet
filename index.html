<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionnaire de Tâches</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Gestionnaire de Tâches</h1>
    </header>

    <section class="card">
      <h2 id="form-title">Ajouter une nouvelle tâche</h2>

      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Titre de la tâche *</label>
          <input
            type="text"
            id="task-title"
            placeholder="ex. : Terminer le TP JavaScript"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-category">Catégorie</label>
            <select id="task-category">
              <option value="Études">Études</option>
              <option value="Travail">Travail</option>
              <option value="Personnel">Personnel</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-priority">Priorité</label>
            <select id="task-priority">
              <option value="Basse">Basse</option>
              <option value="Moyenne" selected>Moyenne</option>
              <option value="Haute">Haute</option>
            </select>
          </div>
        </div>

        <p id="form-error" class="error-message" aria-live="polite"></p>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            Ajouter
          </button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">
            Annuler
          </button>
        </div>
      </form>
    </section>

    <!-- Section Liste des tâches -->
    <section class="card">
      <div class="list-header">
        <h2>Mes tâches (<span id="task-count">0</span>)</h2>
        <div class="filter-group">
          <label for="filter-status">Filtrer :</label>
          <select id="filter-status">
            <option value="all">Toutes</option>
            <option value="pending">En cours</option>
            <option value="completed">Terminées</option>
          </select>
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message">Aucune tâche pour le moment. Ajoutez-en une ci-dessus !</p>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
